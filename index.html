<!DOCTYPE html>
<html>
    <head>
        <title>Building a calculator with JavaScript</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h>Building a simple calculator using JavaScript</h><br>
        <div class="container">
            <div class="calculator">
                 <form>
                    <div class="display">
                        <input type="text" name="display" id="display" readonly>
                    </div>
                    <div>
                        <input id="clrbtn" type="button" value="AC" onclick="display.value=''">
                        <input id="debtn" type="button" value="DE" onclick="display.value=display.value.toString(display.value).slice(0, -1)">
                        <input id="dobtn" type="button" value="." onclick="display.value +='.'">
                        <input class="opbtn" type="button" value="*" onclick="display.value +='*'">
                    </div>
                    <div>
                        <input type="button" value ="7" onclick="display.value +='7'">
                        <input type="button" value="8" onclick="display.value +='8'">
                        <input type="button" value="9" onclick="display.value +='9'">
                        <input class="opbtn" type="button" value="+" onclick="display.value +='+'">
                    </div>
                    <div>
                        <input type="button" value="4" onclick="display.value +='4'">
                        <input type="button" value="5" onclick="display.value +='5'">
                        <input type="button" value="6" onclick="display.value +='6'">
                        <input class="opbtn" type="button" value="-" onclick="display.value +='-'">
                    </div>
                    <div>
                        <input type="button" value="1" onclick="display.value +='1'">
                        <input type="button" value="2" onclick="display.value +='2'">
                        <input type="button" value="3" onclick="display.value +='3'">
                        <input class="opbtn" type="button" value="/" onclick="display.value +='/'">
                    </div>
                    <div>
                        <input id="perbtn" type="button" value="%" onclick="display.value = display.value/100">
                        <input type="button" value="0" onclick="display.value +='0'">
                        <input id="equalbtn" type="button" value="=" onclick="calculate()">
                    </div>
                 </form>
            </div>
        </div>
        <script type="text/JavaScript" src="index.js">

        </script>
    </body>
</html>
